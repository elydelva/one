version: "2"

linters:
  enable:
    - staticcheck
    - errcheck
    - govet
    - unused
    - gocritic
    - gosec
    - revive
    - exhaustive
    - bodyclose
    - contextcheck
    - noctx
    - depguard
  settings:
    depguard:
      rules:
        core-no-external:
          files:
            - "internal/core/**"
          deny:
            - pkg: "github.com/**"
              desc: "internal/core must only import stdlib"
            - pkg: "golang.org/x/**"
              desc: "internal/core must only import stdlib"
            - pkg: "filippo.io/**"
              desc: "internal/core must only import stdlib"
    gosec:
      excludes:
        - G304
    errcheck:
      # fmt.Fprint* to stdout/stderr cannot meaningfully fail and the error is
      # conventionally ignored. Real file/network writes use os.WriteFile etc.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: var-naming
          severity: warning
        - name: error-return
          severity: warning
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    rules:
      # WASM host-boundary code converts memory offsets/lengths (uint32 in the
      # wasm32 address space) to/from Go int. These are non-negative and bounded
      # by the linear-memory limit, so G115 overflow warnings are false positives.
      # Scoped to the runtime package so G115 stays active everywhere else.
      - path: "internal/adapters/runtime/"
        linters:
          - gosec
        text: "G115"
      - path: "internal/testing/"
        linters:
          - errcheck
      - path: "_test.go"
        linters:
          - gosec
          - errcheck
      - path: "cmd/one/main.go"
        linters:
          - revive
      - path: "internal/adapters/renderer/tty.go"
        linters:
          - errcheck
      - path: "internal/adapters/transport/nethttp.go"
        linters:
          - gosec

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - elydelva/one

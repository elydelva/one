coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 70%
        threshold: 2%
        if_not_found: success
        if_ci_failed: error

    patch:
      default:
        target: 70%
        threshold: 5%
        if_not_found: success
        if_ci_failed: error

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
  individual_components:
    - component_id: core
      name: internal/core
      paths:
        - internal/core/**
      statuses:
        - type: project
          target: 85%
          threshold: 2%

    - component_id: app
      name: internal/app
      paths:
        - internal/app/**
      statuses:
        - type: project
          target: 75%
          threshold: 2%

    - component_id: adapters
      name: internal/adapters
      paths:
        - internal/adapters/**
      statuses:
        - type: project
          target: 70%
          threshold: 2%

    - component_id: cli
      name: internal/cli
      paths:
        - internal/cli/**
      statuses:
        - type: project
          target: 60%
          threshold: 5%

ignore:
  - "cmd/one/main.go"
  - "internal/testing/**"
  - "tests/**"
  - "**/*_test.go"

comment:
  layout: "reach,diff,flags,components,tree"
  behavior: default
  require_changes: false
  show_carryforward_flags: true

flags:
  unit:
    paths:
      - internal/
    carryforward: true

  security:
    paths:
      - tests/security/
    carryforward: false

  e2e:
    paths:
      - tests/e2e/
    carryforward: false

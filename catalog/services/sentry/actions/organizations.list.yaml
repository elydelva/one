id: organizations.list
description: List organizations the auth token has access to
permission: org.read
request:
  method: GET
  path: /organizations/
inputs:
  - name: cursor
    type: string
    location: query
  - name: owner
    type: boolean
    location: query
pagination:
  style: cursor
  request_param: cursor
  request_location: query
  response_token: next_cursor
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "429": {code: ratelimited, hint: "Sentry rate limit; back off and retry"}

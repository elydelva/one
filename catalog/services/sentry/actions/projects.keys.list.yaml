id: projects.keys.list
description: List client DSN keys for a project
permission: project.read
request:
  method: GET
  path: /projects/{organization_slug}/{project_slug}/keys/
inputs:
  - name: organization_slug
    type: string
    required: true
    location: path
  - name: project_slug
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

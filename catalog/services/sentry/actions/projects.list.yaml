id: projects.list
description: List projects accessible to the auth token
permission: project.read
request:
  method: GET
  path: /projects/
inputs:
  - name: cursor
    type: string
    location: query
pagination:
  style: cursor
  request_param: cursor
  request_location: query
  response_token: next_cursor
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "429": {code: ratelimited}

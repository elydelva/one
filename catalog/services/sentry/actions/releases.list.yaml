id: releases.list
description: List releases in an organization
permission: releases.read
request:
  method: GET
  path: /organizations/{organization_slug}/releases/
inputs:
  - name: organization_slug
    type: string
    required: true
    location: path
  - name: query
    type: string
    location: query
  - name: project
    type: array
    location: query
  - name: cursor
    type: string
    location: query
pagination:
  style: cursor
  request_param: cursor
  request_location: query
  response_token: next_cursor
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: chat.deleteScheduledMessage
description: Cancel a previously scheduled message
permission: chat.write
side_effects: write
request:
  method: POST
  path: /chat.deleteScheduledMessage
  body: $inputs
inputs:
  - name: channel
    type: string
    required: true
    location: body
  - name: scheduled_message_id
    type: string
    required: true
    location: body
  - name: as_user
    type: boolean
    location: body

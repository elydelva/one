id: chat.postEphemeral
description: Post a message visible only to a single user in a channel
permission: chat.write
side_effects: write
request:
  method: POST
  path: /chat.postEphemeral
  body: $inputs
inputs:
  - name: channel
    type: string
    required: true
    location: body
  - name: user
    type: string
    required: true
    location: body
    description: "User ID who will see the ephemeral message"
  - name: text
    type: string
    location: body
  - name: blocks
    type: array
    location: body
  - name: attachments
    type: array
    location: body
  - name: thread_ts
    type: string
    location: body
  - name: parse
    type: string
    location: body
  - name: link_names
    type: boolean
    location: body

id: workflow_states.list
description: List workflow states (per team) — resolve state name → ID
permission: teams.read
side_effects: read
request:
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  body: '{"query":"query($filter: WorkflowStateFilter, $first: Int, $after: String){ workflowStates(filter:$filter, first:$first, after:$after){ nodes { id name type color team { id key } } pageInfo { hasNextPage endCursor } } }","variables":{"filter":{filter|json},"first":{first|json},"after":{after|json}}}'
inputs:
  - name: filter
    type: object
    location: body
    description: "WorkflowStateFilter — e.g. {team:{key:{eq:'ENG'}}}"
  - name: first
    type: integer
    location: body
    default: 50
  - name: after
    type: string
    location: body
pagination:
  style: cursor
  request_param: after
  request_location: body
  response_token: endCursor
  response_items: data.workflowStates.nodes
  max_pages: 5
errors:
  "401": {code: auth_failed}

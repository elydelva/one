id: documents.update
description: Update a document
permission: documents.write
side_effects: write
request:
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  body: '{"query":"mutation($id: String!, $input: DocumentUpdateInput!){ documentUpdate(id:$id, input:$input){ success document { id title } } }","variables":{"id":{id|json},"input":{input|json}}}'
inputs:
  - name: id
    type: string
    required: true
    location: body
  - name: input
    type: object
    required: true
    location: body
    description: "DocumentUpdateInput fields: title, content, icon, color, projectId."
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: comments.list
description: List comments on an issue
permission: issues.read
side_effects: read
request:
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  body: '{"query":"query($issueId: String!, $first: Int, $after: String){ issue(id:$issueId){ comments(first:$first, after:$after){ nodes { id body createdAt user { name } parent { id } } pageInfo { hasNextPage endCursor } } } }","variables":{"issueId":{issue_id|json},"first":{first|json},"after":{after|json}}}'
inputs:
  - name: issue_id
    type: string
    required: true
    location: body
  - name: first
    type: integer
    location: body
    default: 50
  - name: after
    type: string
    location: body
pagination:
  style: cursor
  request_param: after
  request_location: body
  response_token: endCursor
  response_items: data.issue.comments.nodes
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

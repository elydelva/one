id: attachments.create
description: Link an external resource (GitHub PR, URL) to an issue
permission: attachments.write
side_effects: write
request:
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  body: '{"query":"mutation($input: AttachmentCreateInput!){ attachmentCreate(input:$input){ success attachment { id url title } } }","variables":{"input":{input|json}}}'
inputs:
  - name: input
    type: object
    required: true
    location: body
    description: "AttachmentCreateInput. Required: issueId, title, url. Optional: subtitle, iconUrl, metadata."
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

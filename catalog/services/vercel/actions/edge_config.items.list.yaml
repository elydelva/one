id: edge_config.items.list
description: List all items in an Edge Config
permission: edge_config.read
request:
  method: GET
  path: /v1/edge-config/{edgeConfigId}/items
inputs:
  - name: edgeConfigId
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

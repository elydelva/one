id: webhooks.delete
description: Delete a webhook
permission: webhooks.write
side_effects: write
request:
  method: DELETE
  path: /v1/webhooks/{id}
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

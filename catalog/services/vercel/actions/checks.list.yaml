id: checks.list
description: List checks for a deployment
permission: checks.read
request:
  method: GET
  path: /v1/deployments/{deploymentId}/checks
inputs:
  - name: deploymentId
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: env.delete
description: Delete a project env var by ID
permission: env.write
side_effects: write
request:
  method: DELETE
  path: /v9/projects/{idOrName}/env/{id}
inputs:
  - name: idOrName
    type: string
    required: true
    location: path
  - name: id
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

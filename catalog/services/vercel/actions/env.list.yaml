id: env.list
description: List environment variables for a project
permission: env.read
request:
  method: GET
  path: /v9/projects/{idOrName}/env
inputs:
  - name: idOrName
    type: string
    required: true
    location: path
  - name: decrypt
    type: string
    location: query
    enum: ["true", "false"]
  - name: source
    type: string
    location: query
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

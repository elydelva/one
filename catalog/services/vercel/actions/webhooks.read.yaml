id: webhooks.read
description: Get a webhook by ID
permission: webhooks.read
request:
  method: GET
  path: /v1/webhooks/{id}
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: projects.update
description: Update a project's settings
permission: projects.write
side_effects: write
request:
  method: PATCH
  path: /v9/projects/{idOrName}
  body: $inputs
inputs:
  - name: idOrName
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: framework
    type: string
    location: body
  - name: buildCommand
    type: string
    location: body
  - name: devCommand
    type: string
    location: body
  - name: installCommand
    type: string
    location: body
  - name: outputDirectory
    type: string
    location: body
  - name: rootDirectory
    type: string
    location: body
  - name: nodeVersion
    type: string
    location: body
  - name: publicSource
    type: boolean
    location: body
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "400": {code: validation_failed}

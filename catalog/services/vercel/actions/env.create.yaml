id: env.create
description: Create one or more env vars on a project
permission: env.write
side_effects: write
request:
  method: POST
  path: /v10/projects/{idOrName}/env
  body: $inputs
inputs:
  - name: idOrName
    type: string
    required: true
    location: path
  - name: key
    type: string
    location: body
  - name: value
    type: string
    location: body
  - name: type
    type: string
    location: body
    enum: [system, secret, encrypted, plain, sensitive]
  - name: target
    type: array
    location: body
    description: "Array of: production, preview, development"
  - name: gitBranch
    type: string
    location: body
  - name: comment
    type: string
    location: body
  - name: customEnvironmentIds
    type: array
    location: body
  - name: upsert
    type: string
    location: query
    enum: ["true", "false"]
  - name: teamId
    type: string
    location: query
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}
  "409": {code: conflict, hint: "Env var with same key+target exists. Use upsert=true."}

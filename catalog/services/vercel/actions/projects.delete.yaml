id: projects.delete
description: Delete a project
permission: projects.write
side_effects: write
request:
  method: DELETE
  path: /v9/projects/{idOrName}
inputs:
  - name: idOrName
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

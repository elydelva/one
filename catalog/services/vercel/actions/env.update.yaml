id: env.update
description: Update a project env var by ID
permission: env.write
side_effects: write
request:
  method: PATCH
  path: /v9/projects/{idOrName}/env/{id}
  body: $inputs
inputs:
  - name: idOrName
    type: string
    required: true
    location: path
  - name: id
    type: string
    required: true
    location: path
  - name: key
    type: string
    location: body
  - name: value
    type: string
    location: body
  - name: type
    type: string
    location: body
    enum: [system, secret, encrypted, plain, sensitive]
  - name: target
    type: array
    location: body
  - name: gitBranch
    type: string
    location: body
  - name: comment
    type: string
    location: body
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "400": {code: validation_failed}

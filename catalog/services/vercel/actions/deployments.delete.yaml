id: deployments.delete
description: Delete a deployment by ID or URL
permission: deployments.write
side_effects: write
request:
  method: DELETE
  path: /v13/deployments/{id}
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: url
    type: string
    location: query
    description: "Deployment URL (alternative to id)"
  - name: teamId
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: checks.create
description: Create a new check on a deployment
permission: checks.write
side_effects: write
request:
  method: POST
  path: /v1/deployments/{deploymentId}/checks
  body: $inputs
inputs:
  - name: deploymentId
    type: string
    required: true
    location: path
  - name: name
    type: string
    required: true
    location: body
  - name: path
    type: string
    location: body
  - name: blocking
    type: boolean
    location: body
  - name: detailsUrl
    type: string
    location: body
  - name: externalId
    type: string
    location: body
  - name: rerequestable
    type: boolean
    location: body
  - name: teamId
    type: string
    location: query
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

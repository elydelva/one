id: logs.runtime
description: Get runtime logs for a deployment
permission: logs.read
request:
  method: GET
  path: /v1/projects/{projectId}/deployments/{deploymentId}/runtime-logs
inputs:
  - name: projectId
    type: string
    required: true
    location: path
  - name: deploymentId
    type: string
    required: true
    location: path
  - name: teamId
    type: string
    location: query
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "403": {code: forbidden}

id: search.code
description: Search code across GitHub
permission: repo.read
side_effects: read
request:
  method: GET
  path: /search/code
inputs:
  - name: q
    type: string
    required: true
    location: query
    description: "Must include repo, org, or user qualifier"
  - name: page
    type: integer
    location: query
  - name: per_page
    type: integer
    location: query
    default: 30
pagination:
  style: cursor
  request_param: page
  request_location: query
  response_token: next_page
  response_items: items
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "422": {code: validation_failed, hint: "Code search requires authentication + qualifier."}
  "429": {code: rate_limited, retry: backoff}

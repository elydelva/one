id: labels.create
description: Create a label
permission: issues.write
side_effects: write
request:
  method: POST
  path: /repos/{owner}/{repo}/labels
  body: $inputs
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: name
    type: string
    required: true
    location: body
  - name: color
    type: string
    location: body
    description: "6-char hex (no #)"
  - name: description
    type: string
    location: body
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "422": {code: validation_failed}

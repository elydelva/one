id: branches.delete
description: Delete a branch (deletes git ref)
permission: repo.write
side_effects: write
request:
  method: DELETE
  path: /repos/{owner}/{repo}/git/refs/heads/{branch}
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: branch
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "422": {code: forbidden, hint: "Protected branch or only-default-branch restriction."}

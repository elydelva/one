id: pulls.list
description: List pull requests (cursor-paginated)
permission: pulls.read
side_effects: read
request:
  method: GET
  path: /repos/{owner}/{repo}/pulls
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: state
    type: string
    location: query
    enum: [open, closed, all]
    default: open
  - name: head
    type: string
    location: query
    description: "Filter by head branch (user:branch or org:branch)"
  - name: base
    type: string
    location: query
  - name: sort
    type: string
    location: query
    enum: [created, updated, popularity, long-running]
  - name: direction
    type: string
    location: query
    enum: [asc, desc]
  - name: page
    type: integer
    location: query
  - name: per_page
    type: integer
    location: query
    default: 30
pagination:
  style: cursor
  request_param: page
  request_location: query
  response_token: next_page
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

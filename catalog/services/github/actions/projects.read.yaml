id: projects.read
description: Read a GitHub Project v2 by node ID
permission: projects.read
side_effects: read
request:
  method: POST
  path: /graphql
  response_errors_key: errors
  body: '{"query":"query ($projectId: ID!) { node(id: $projectId) { ... on ProjectV2 { id title url closed } } }","variables":{"projectId":{project_id|json}}}'
inputs:
  - name: project_id
    type: string
    required: true
    location: body
    description: GitHub GraphQL node ID for the project
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}

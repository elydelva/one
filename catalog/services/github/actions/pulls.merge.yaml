id: pulls.merge
description: Merge a pull request
permission: pulls.write
side_effects: write
request:
  method: PUT
  path: /repos/{owner}/{repo}/pulls/{pull_number}/merge
  body: $inputs
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: pull_number
    type: integer
    required: true
    location: path
  - name: commit_title
    type: string
    location: body
  - name: commit_message
    type: string
    location: body
  - name: merge_method
    type: string
    location: body
    enum: [merge, squash, rebase]
    default: merge
  - name: sha
    type: string
    location: body
    description: "SHA the HEAD must match for merge to proceed"
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "405": {code: conflict, hint: "PR not mergeable (conflicts, checks failing, branch protection)."}
  "409": {code: conflict, hint: "Head SHA mismatch."}
  "422": {code: validation_failed}

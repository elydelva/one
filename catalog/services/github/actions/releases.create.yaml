id: releases.create
description: Create a release
permission: repo.write
side_effects: write
request:
  method: POST
  path: /repos/{owner}/{repo}/releases
  body: $inputs
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: tag_name
    type: string
    required: true
    location: body
  - name: target_commitish
    type: string
    location: body
  - name: name
    type: string
    location: body
  - name: body
    type: string
    location: body
  - name: draft
    type: boolean
    location: body
    default: false
  - name: prerelease
    type: boolean
    location: body
    default: false
  - name: generate_release_notes
    type: boolean
    location: body
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "422": {code: validation_failed}

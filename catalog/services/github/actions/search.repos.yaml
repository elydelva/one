id: search.repos
description: Search repositories
permission: repo.read
side_effects: read
request:
  method: GET
  path: /search/repositories
inputs:
  - name: q
    type: string
    required: true
    location: query
  - name: sort
    type: string
    location: query
    enum: [stars, forks, help-wanted-issues, updated]
  - name: order
    type: string
    location: query
    enum: [asc, desc]
  - name: page
    type: integer
    location: query
  - name: per_page
    type: integer
    location: query
    default: 30
pagination:
  style: cursor
  request_param: page
  request_location: query
  response_token: next_page
  response_items: items
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "422": {code: validation_failed}
  "429": {code: rate_limited, retry: backoff}

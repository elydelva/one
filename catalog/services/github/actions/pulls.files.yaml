id: pulls.files
description: List files changed in a PR
permission: pulls.read
side_effects: read
request:
  method: GET
  path: /repos/{owner}/{repo}/pulls/{pull_number}/files
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: pull_number
    type: integer
    required: true
    location: path
  - name: page
    type: integer
    location: query
  - name: per_page
    type: integer
    location: query
    default: 30
pagination:
  style: cursor
  request_param: page
  request_location: query
  response_token: next_page
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

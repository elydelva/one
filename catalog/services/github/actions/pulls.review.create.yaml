id: pulls.review.create
description: Submit a PR review (approve, request changes, comment)
permission: pulls.write
side_effects: write
request:
  method: POST
  path: /repos/{owner}/{repo}/pulls/{pull_number}/reviews
  body: $inputs
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: pull_number
    type: integer
    required: true
    location: path
  - name: body
    type: string
    location: body
  - name: event
    type: string
    location: body
    enum: [APPROVE, REQUEST_CHANGES, COMMENT]
    description: "Omit to create a pending review"
  - name: commit_id
    type: string
    location: body
  - name: comments
    type: array
    location: body
    description: "Array of {path, position, body} inline comments"
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "422": {code: validation_failed}

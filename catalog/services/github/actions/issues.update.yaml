id: issues.update
description: Update an issue (title, body, state, assignees, labels, milestone)
permission: issues.write
side_effects: write
request:
  method: PATCH
  path: /repos/{owner}/{repo}/issues/{issue_number}
  body: $inputs
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: issue_number
    type: integer
    required: true
    location: path
  - name: title
    type: string
    location: body
  - name: body
    type: string
    location: body
  - name: state
    type: string
    location: body
    enum: [open, closed]
  - name: state_reason
    type: string
    location: body
    enum: [completed, not_planned, reopened]
  - name: assignees
    type: array
    location: body
  - name: labels
    type: array
    location: body
  - name: milestone
    type: integer
    location: body
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "422": {code: validation_failed}

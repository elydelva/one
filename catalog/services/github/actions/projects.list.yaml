id: projects.list
description: List the authenticated user's first 100 GitHub Projects v2
permission: projects.read
side_effects: read
request:
  method: POST
  path: /graphql
  response_errors_key: errors
  body: '{"query":"query { viewer { projectsV2(first: 100) { nodes { id title url closed } } } }"}'
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}

id: issues.comments.list
description: List comments on an issue or PR
permission: issues.read
side_effects: read
request:
  method: GET
  path: /repos/{owner}/{repo}/issues/{issue_number}/comments
inputs:
  - name: owner
    type: string
    required: true
    location: path
  - name: repo
    type: string
    required: true
    location: path
  - name: issue_number
    type: integer
    required: true
    location: path
  - name: page
    type: integer
    location: query
  - name: per_page
    type: integer
    location: query
    default: 30
pagination:
  style: cursor
  request_param: page
  request_location: query
  response_token: next_page
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: guilds.list_channels
description: List all channels in a guild
permission: guilds.read
side_effects: read
request:
  method: GET
  path: /guilds/{guild_id}/channels
inputs:
  - name: guild_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

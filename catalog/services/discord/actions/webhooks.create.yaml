id: webhooks.create
description: Create a webhook on a channel
permission: webhooks.write
side_effects: write
request:
  method: POST
  path: /channels/{channel_id}/webhooks
  body: $inputs
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    required: true
    location: body
  - name: avatar
    type: string
    location: body
    description: "Base64 image data"
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

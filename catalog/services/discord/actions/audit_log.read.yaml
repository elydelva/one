id: audit_log.read
description: Fetch the audit log for a guild
permission: guilds.read
side_effects: read
request:
  method: GET
  path: /guilds/{guild_id}/audit-logs
inputs:
  - name: guild_id
    type: string
    required: true
    location: path
  - name: user_id
    type: string
    location: query
  - name: action_type
    type: integer
    location: query
  - name: before
    type: string
    location: query
  - name: after
    type: string
    location: query
  - name: limit
    type: integer
    location: query
    default: 50
    description: "1-100"
pagination:
  style: cursor
  request_param: before
  request_location: query
  response_token: next_before
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

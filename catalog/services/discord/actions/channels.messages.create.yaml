id: channels.messages.create
description: Post a message to a channel
permission: messages.write
side_effects: write
request:
  method: POST
  path: /channels/{channel_id}/messages
  body: $inputs
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
  - name: content
    type: string
    location: body
    description: "Message text (<= 2000 chars)"
  - name: tts
    type: boolean
    location: body
  - name: embeds
    type: array
    location: body
  - name: allowed_mentions
    type: object
    location: body
  - name: message_reference
    type: object
    location: body
    description: "{message_id, channel_id?, guild_id?} for replies"
  - name: components
    type: array
    location: body
  - name: sticker_ids
    type: array
    location: body
  - name: flags
    type: integer
    location: body
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "400": {code: validation_failed}
  "429": {code: rate_limited, retry: backoff}

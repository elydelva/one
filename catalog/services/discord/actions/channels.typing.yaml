id: channels.typing
description: Trigger the typing indicator in a channel
permission: messages.write
side_effects: write
request:
  method: POST
  path: /channels/{channel_id}/typing
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

id: threads.leave
description: Have the current bot leave a thread
permission: channels.write
side_effects: write
request:
  method: DELETE
  path: /channels/{channel_id}/thread-members/@me
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

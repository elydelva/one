id: webhooks.update
description: Modify a webhook
permission: webhooks.write
side_effects: write
request:
  method: PATCH
  path: /webhooks/{webhook_id}
  body: $inputs
inputs:
  - name: webhook_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: avatar
    type: string
    location: body
  - name: channel_id
    type: string
    location: body
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

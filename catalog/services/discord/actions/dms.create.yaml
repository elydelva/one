id: dms.create
description: Open a DM channel with a user
permission: messages.write
side_effects: write
request:
  method: POST
  path: /users/@me/channels
  body: $inputs
inputs:
  - name: recipient_id
    type: string
    required: true
    location: body
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

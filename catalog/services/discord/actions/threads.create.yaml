id: threads.create
description: Start a thread without an anchor message
permission: channels.write
side_effects: write
request:
  method: POST
  path: /channels/{channel_id}/threads
  body: $inputs
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    required: true
    location: body
  - name: type
    type: integer
    location: body
    description: "11=public, 12=private"
  - name: auto_archive_duration
    type: integer
    location: body
  - name: invitable
    type: boolean
    location: body
  - name: rate_limit_per_user
    type: integer
    location: body
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

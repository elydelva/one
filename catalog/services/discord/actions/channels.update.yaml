id: channels.update
description: Modify a channel (name, topic, position, parent, etc.)
permission: channels.write
side_effects: write
request:
  method: PATCH
  path: /channels/{channel_id}
  body: $inputs
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: topic
    type: string
    location: body
  - name: nsfw
    type: boolean
    location: body
  - name: rate_limit_per_user
    type: integer
    location: body
  - name: position
    type: integer
    location: body
  - name: parent_id
    type: string
    location: body
  - name: bitrate
    type: integer
    location: body
  - name: user_limit
    type: integer
    location: body
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

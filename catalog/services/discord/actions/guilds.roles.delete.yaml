id: guilds.roles.delete
description: Delete a role
permission: roles.write
side_effects: write
request:
  method: DELETE
  path: /guilds/{guild_id}/roles/{role_id}
inputs:
  - name: guild_id
    type: string
    required: true
    location: path
  - name: role_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

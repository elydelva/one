id: reactions.add
description: Add a reaction (as the bot) to a message
permission: messages.write
side_effects: write
request:
  method: PUT
  path: /channels/{channel_id}/messages/{message_id}/reactions/{emoji}/@me
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
  - name: message_id
    type: string
    required: true
    location: path
  - name: emoji
    type: string
    required: true
    location: path
    description: "URL-encoded unicode emoji or name:id for custom"
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

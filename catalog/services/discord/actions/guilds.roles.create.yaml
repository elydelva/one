id: guilds.roles.create
description: Create a role in a guild
permission: roles.write
side_effects: write
request:
  method: POST
  path: /guilds/{guild_id}/roles
  body: $inputs
inputs:
  - name: guild_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: permissions
    type: string
    location: body
    description: "Bitfield as string"
  - name: color
    type: integer
    location: body
  - name: hoist
    type: boolean
    location: body
  - name: mentionable
    type: boolean
    location: body
  - name: icon
    type: string
    location: body
    description: "Base64 image data"
  - name: unicode_emoji
    type: string
    location: body
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "400": {code: validation_failed}
  "429": {code: rate_limited, retry: backoff}

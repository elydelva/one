id: channels.delete
description: Delete a channel (or close a DM)
permission: channels.write
side_effects: write
request:
  method: DELETE
  path: /channels/{channel_id}
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

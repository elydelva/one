id: guilds.bans.delete
description: Unban a user from a guild
permission: members.write
side_effects: write
request:
  method: DELETE
  path: /guilds/{guild_id}/bans/{user_id}
inputs:
  - name: guild_id
    type: string
    required: true
    location: path
  - name: user_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

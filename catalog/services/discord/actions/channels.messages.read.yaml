id: channels.messages.read
description: Get a single message
permission: messages.read
side_effects: read
request:
  method: GET
  path: /channels/{channel_id}/messages/{message_id}
inputs:
  - name: channel_id
    type: string
    required: true
    location: path
  - name: message_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "403": {code: forbidden}
  "404": {code: not_found}
  "429": {code: rate_limited, retry: backoff}

id: d1.databases.create
description: Create a D1 database
permission: d1.write
side_effects: write
request:
  method: POST
  path: /accounts/{account_id}/d1/database
  body: $inputs
inputs:
  - name: account_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    required: true
    location: body
  - name: primary_location_hint
    type: string
    location: body
    description: "wnam, enam, weur, eeur, apac, oc"
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}

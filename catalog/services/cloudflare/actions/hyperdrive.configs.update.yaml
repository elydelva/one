id: hyperdrive.configs.update
description: Update a Hyperdrive config
permission: hyperdrive.write
side_effects: write
request:
  method: PUT
  path: /accounts/{account_id}/hyperdrive/configs/{hyperdrive_id}
  body: $inputs
inputs:
  - name: account_id
    type: string
    required: true
    location: path
  - name: hyperdrive_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: origin
    type: object
    location: body
  - name: caching
    type: object
    location: body
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

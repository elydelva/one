id: workers.subdomain.read
description: Get the workers.dev subdomain for an account
permission: workers.read
request:
  method: GET
  path: /accounts/{account_id}/workers/subdomain
inputs:
  - name: account_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

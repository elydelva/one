id: email_routing.rules.create
description: Create an Email Routing rule
permission: email.write
side_effects: write
request:
  method: POST
  path: /zones/{zone_id}/email/routing/rules
  body: $inputs
inputs:
  - name: zone_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: enabled
    type: boolean
    location: body
  - name: matchers
    type: array
    required: true
    location: body
    description: "[{type: 'literal', field: 'to', value: 'foo@example.com'}]"
  - name: actions
    type: array
    required: true
    location: body
    description: "[{type: 'forward', value: ['dest@example.com']}]"
  - name: priority
    type: integer
    location: body
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}

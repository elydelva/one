id: workers.routes.delete
description: Delete a Worker route
permission: workers.write
side_effects: write
request:
  method: DELETE
  path: /zones/{zone_id}/workers/routes/{route_id}
inputs:
  - name: zone_id
    type: string
    required: true
    location: path
  - name: route_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

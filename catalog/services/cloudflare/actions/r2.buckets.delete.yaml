id: r2.buckets.delete
description: Delete an R2 bucket (must be empty)
permission: r2.write
side_effects: write
request:
  method: DELETE
  path: /accounts/{account_id}/r2/buckets/{bucket_name}
inputs:
  - name: account_id
    type: string
    required: true
    location: path
  - name: bucket_name
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}
  "409": {code: conflict, hint: "Bucket not empty"}

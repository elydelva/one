id: d1.databases.list
description: List D1 databases in an account
permission: d1.read
request:
  method: GET
  path: /accounts/{account_id}/d1/database
inputs:
  - name: account_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: query
  - name: page
    type: integer
    location: query
  - name: per_page
    type: integer
    location: query
pagination:
  style: cursor
  request_param: page
  request_location: query
  response_token: result_info.next_page
  max_pages: 10
errors:
  "401": {code: auth_failed}

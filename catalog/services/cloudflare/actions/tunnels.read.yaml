id: tunnels.read
description: Get a Cloudflare Tunnel by ID
permission: tunnel.read
request:
  method: GET
  path: /accounts/{account_id}/cfd_tunnel/{tunnel_id}
inputs:
  - name: account_id
    type: string
    required: true
    location: path
  - name: tunnel_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

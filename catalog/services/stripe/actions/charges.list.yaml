id: charges.list
description: List charges (cursor-paginated).
permission: payments.read
request:
  method: GET
  path: /v1/charges
inputs:
  - name: customer
    type: string
    location: query
  - name: payment_intent
    type: string
    location: query
  - name: limit
    type: integer
    location: query
  - name: starting_after
    type: string
    location: query
  - name: created
    type: string
    location: query
errors:
  "401": {code: auth_failed}
  "429": {code: rate_limited, retry: backoff}

id: payment_methods.detach
description: Detach a payment method from its customer.
permission: customers.write
side_effects: write
request:
  method: POST
  path: /v1/payment_methods/{id}/detach
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Usually empty: "".'
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

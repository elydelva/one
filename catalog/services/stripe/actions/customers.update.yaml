id: customers.update
description: Update a customer. Body is form-encoded.
permission: customers.write
side_effects: write
request:
  method: POST
  path: /v1/customers/{id}
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Form-encoded. e.g. "email=new@x.io&metadata[tier]=gold"'
  - name: Idempotency-Key
    type: string
    location: header
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

id: payment_intents.cancel
description: Cancel a PaymentIntent.
permission: payments.write
side_effects: write
request:
  method: POST
  path: /v1/payment_intents/{id}/cancel
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Form-encoded. Optional: cancellation_reason=duplicate|fraudulent|requested_by_customer|abandoned.'
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

id: invoices.send
description: Email the invoice to the customer (collection_method=send_invoice).
permission: invoices.write
side_effects: write
request:
  method: POST
  path: /v1/invoices/{id}/send
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Form-encoded. Usually empty: "".'
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

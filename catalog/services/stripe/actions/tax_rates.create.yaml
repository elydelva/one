id: tax_rates.create
description: Create a tax rate.
permission: products.write
side_effects: write
request:
  method: POST
  path: /v1/tax_rates
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: body_raw
    type: string
    required: true
    location: body
    description: |
      Form-encoded. Required: display_name, percentage, inclusive=true|false.
      Optional: country, state, jurisdiction, description, tax_type, active.
  - name: Idempotency-Key
    type: string
    location: header
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}

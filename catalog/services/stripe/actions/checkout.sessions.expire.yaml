id: checkout.sessions.expire
description: Expire an open Checkout Session.
permission: payments.write
side_effects: write
request:
  method: POST
  path: /v1/checkout/sessions/{id}/expire
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Usually "".'
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

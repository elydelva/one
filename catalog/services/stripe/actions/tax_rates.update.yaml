id: tax_rates.update
description: Update a tax rate (most fields immutable; mainly active, display_name, description).
permission: products.write
side_effects: write
request:
  method: POST
  path: /v1/tax_rates/{id}
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Form-encoded. e.g. "active=false&display_name=Legacy"'
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

id: checkout.sessions.create
description: Create a hosted Checkout Session and get its URL.
permission: payments.write
side_effects: write
request:
  method: POST
  path: /v1/checkout/sessions
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: body_raw
    type: string
    required: true
    location: body
    description: |
      Form-encoded. Required: mode=payment|subscription|setup,
      line_items[0][price], line_items[0][quantity], success_url.
      Common: cancel_url, customer, customer_email, client_reference_id,
      allow_promotion_codes=true, automatic_tax[enabled]=true,
      payment_method_types[]=card, ui_mode=hosted|embedded, return_url.
  - name: Idempotency-Key
    type: string
    location: header
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}

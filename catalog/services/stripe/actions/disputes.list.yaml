id: disputes.list
description: List disputes.
permission: payments.read
request:
  method: GET
  path: /v1/disputes
inputs:
  - name: charge
    type: string
    location: query
  - name: payment_intent
    type: string
    location: query
  - name: limit
    type: integer
    location: query
  - name: starting_after
    type: string
    location: query
errors:
  "401": {code: auth_failed}

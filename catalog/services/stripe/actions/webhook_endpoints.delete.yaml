id: webhook_endpoints.delete
description: Delete a webhook endpoint.
permission: webhooks.write
side_effects: write
request:
  method: DELETE
  path: /v1/webhook_endpoints/{id}
inputs:
  - name: id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: coupons.update
description: Update a coupon (name and metadata only).
permission: products.write
side_effects: write
request:
  method: POST
  path: /v1/coupons/{id}
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: '{body_raw}'
inputs:
  - name: id
    type: string
    required: true
    location: path
  - name: body_raw
    type: string
    required: true
    location: body
    description: 'Form-encoded. e.g. "name=Updated&metadata[campaign]=summer"'
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

id: users.assignable.search
description: Find users assignable to a project or issue
permission: users.read
side_effects: read
request:
  method: GET
  path: /rest/api/3/user/assignable/search
inputs:
  - name: query
    type: string
    location: query
  - name: project
    type: string
    location: query
  - name: issueKey
    type: string
    location: query
  - name: startAt
    type: integer
    location: query
  - name: maxResults
    type: integer
    location: query
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

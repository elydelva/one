id: sprints.issues.list
description: List issues in a sprint
permission: boards.read
side_effects: read
request:
  method: GET
  path: /rest/agile/1.0/sprint/{sprintId}/issue
inputs:
  - name: sprintId
    type: integer
    required: true
    location: path
  - name: jql
    type: string
    location: query
  - name: fields
    type: string
    location: query
  - name: startAt
    type: integer
    location: query
  - name: maxResults
    type: integer
    location: query
pagination:
  style: offset
  request_param: startAt
  request_location: query
  page_size_param: maxResults
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

id: comments.create
description: Add a comment to an issue. `body` is ADF.
permission: comments.write
side_effects: write
request:
  method: POST
  path: /rest/api/3/issue/{issueIdOrKey}/comment
  body: $inputs
inputs:
  - name: issueIdOrKey
    type: string
    required: true
    location: path
  - name: body
    type: object
    required: true
    location: body
    description: "ADF document"
  - name: visibility
    type: object
    location: body
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

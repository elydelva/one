id: project_versions.list
description: List versions of a project (paginated)
permission: projects.read
side_effects: read
request:
  method: GET
  path: /rest/api/3/project/{projectIdOrKey}/version
inputs:
  - name: projectIdOrKey
    type: string
    required: true
    location: path
  - name: startAt
    type: integer
    location: query
  - name: maxResults
    type: integer
    location: query
  - name: orderBy
    type: string
    location: query
  - name: query
    type: string
    location: query
  - name: status
    type: string
    location: query
pagination:
  style: offset
  request_param: startAt
  request_location: query
  page_size_param: maxResults
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

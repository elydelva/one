id: sprints.read
description: Get a sprint by id
permission: boards.read
side_effects: read
request:
  method: GET
  path: /rest/agile/1.0/sprint/{sprintId}
inputs:
  - name: sprintId
    type: integer
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

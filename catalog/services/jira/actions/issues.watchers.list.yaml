id: issues.watchers.list
description: List watchers of an issue
permission: issues.read
side_effects: read
request:
  method: GET
  path: /rest/api/3/issue/{issueIdOrKey}/watchers
inputs:
  - name: issueIdOrKey
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

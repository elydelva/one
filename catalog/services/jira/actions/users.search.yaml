id: users.search
description: Search users by query (name/email)
permission: users.read
side_effects: read
request:
  method: GET
  path: /rest/api/3/user/search
inputs:
  - name: query
    type: string
    location: query
  - name: accountId
    type: string
    location: query
  - name: startAt
    type: integer
    location: query
  - name: maxResults
    type: integer
    location: query
    default: 50
pagination:
  style: offset
  request_param: startAt
  request_location: query
  page_size_param: maxResults
  max_pages: 5
errors:
  "401": {code: auth_failed}

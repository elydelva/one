id: sprints.update
description: Update a sprint (start with state=active, complete with state=closed)
permission: sprints.write
side_effects: write
request:
  method: POST
  path: /rest/agile/1.0/sprint/{sprintId}
  body: $inputs
inputs:
  - name: sprintId
    type: integer
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: state
    type: string
    location: body
    enum: [future, active, closed]
  - name: goal
    type: string
    location: body
  - name: startDate
    type: string
    location: body
  - name: endDate
    type: string
    location: body
  - name: completeDate
    type: string
    location: body
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

id: data_sources.templates
description: List templates available for a data source
permission: databases.read
side_effects: read
request:
  method: GET
  path: /v1/data_sources/{data_source_id}/templates
  headers:
    Notion-Version: "2025-09-03"
inputs:
  - name: data_source_id
    type: string
    required: true
    location: path
  - name: start_cursor
    type: string
    location: query
  - name: page_size
    type: integer
    location: query
    default: 100
    max: 100
pagination:
  style: cursor
  request_param: start_cursor
  request_location: query
  response_token: next_cursor
  response_items: results
  max_pages: 10
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

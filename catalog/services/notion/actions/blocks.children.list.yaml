id: blocks.children.list
description: List children blocks of a page or block. Paginated → `.data` is a flat array (no `.results` wrapper).
permission: blocks.read
side_effects: read
request:
  method: GET
  path: /v1/blocks/{block_id}/children
  headers:
    Notion-Version: "2022-06-28"
inputs:
  - name: block_id
    type: string
    required: true
    location: path
  - name: page_size
    type: integer
    location: query
    default: 100
    min: 1
    max: 100
pagination:
  style: cursor
  request_param: start_cursor
  request_location: query
  response_token: next_cursor
  response_items: results
  max_pages: 10
errors:
  "401":
    code: auth_failed
  "404":
    code: not_found

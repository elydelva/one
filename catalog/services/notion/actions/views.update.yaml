id: views.update
description: Update a view (filters, sorts, name, layout)
permission: databases.write
side_effects: write
request:
  method: PATCH
  path: /v1/views/{view_id}
  headers:
    Notion-Version: "2026-04-01"
  body: $inputs
inputs:
  - name: view_id
    type: string
    required: true
    location: path
  - name: name
    type: string
    location: body
  - name: filter
    type: object
    location: body
  - name: sort
    type: array
    location: body
  - name: properties
    type: object
    location: body
errors:
  "400": {code: validation_failed}
  "401": {code: auth_failed}
  "404": {code: not_found}

id: file_uploads.retrieve
description: Retrieve a file upload session — status (pending|uploaded|expired|failed), filename, content_type, size, expiry.
permission: files.read
side_effects: read
request:
  method: GET
  path: /v1/file_uploads/{file_upload_id}
  headers:
    Notion-Version: "2025-09-03"
inputs:
  - name: file_upload_id
    type: string
    required: true
    location: path
errors:
  "401":
    code: auth_failed
  "404":
    code: not_found
  "429":
    code: rate_limited
    retry: backoff

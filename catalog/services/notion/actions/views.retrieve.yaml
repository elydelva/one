id: views.retrieve
description: Retrieve a view config (filters, sorts, layout)
permission: databases.read
side_effects: read
request:
  method: GET
  path: /v1/views/{view_id}
  headers:
    Notion-Version: "2026-04-01"
inputs:
  - name: view_id
    type: string
    required: true
    location: path
errors:
  "401": {code: auth_failed}
  "404": {code: not_found}

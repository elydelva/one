id: file_uploads.list
description: List file upload sessions for this integration, optionally filtered by status. Paginated → `.data` is a flat array (no `.results` wrapper).
permission: files.read
side_effects: read
request:
  method: GET
  path: /v1/file_uploads
  headers:
    Notion-Version: "2025-09-03"
inputs:
  - name: status
    type: string
    location: query
    enum: [pending, uploaded, expired, failed]
    description: "Filter by status."
  - name: page_size
    type: integer
    location: query
    default: 100
    min: 1
    max: 100
pagination:
  style: cursor
  request_param: start_cursor
  request_location: query
  response_token: next_cursor
  response_items: results
  max_pages: 10
errors:
  "401":
    code: auth_failed
  "429":
    code: rate_limited
    retry: backoff

id: pages.replace
description: Replace the entire content of a Notion page with new markdown (destructive)
permission: pages.write
side_effects: destructive
request:
  method: PATCH
  path: /v1/pages/{page_id}/markdown
  headers:
    Notion-Version: "2026-03-11"
  body: '{"type":"replace_content","replace_content":{"new_str":{content|json}},"allow_deleting_content":{allow_deleting_content|json}}'
inputs:
  - name: page_id
    type: string
    required: true
    location: path
  - name: content
    type: string
    required: true
    location: body
    description: "New markdown that replaces the entire page body"
  - name: allow_deleting_content
    type: boolean
    location: body
    default: false
    description: "Permit deletion of child pages/databases"
errors:
  "400":
    code: validation_failed
  "401":
    code: auth_failed
  "403":
    code: forbidden
  "404":
    code: not_found

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: one
    main: ./cmd/one
    binary: one
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: one
    ids:
      - one
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

# SBOM (CycloneDX) attached to each release. cyclonedx-gomod must be installed
# in the release job (see .github/workflows/release.yml).
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.cdx.json"

# Sigstore keyless signing of release artifacts. Requires cosign in CI;
# fulcio/rekor identities authenticate via the workflow's OIDC token.
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge remote-tracking branch

name: Benchmarks

on:
  push:
    branches: [main]

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build binary
        run: go build -o bin/one ./cmd/one
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run='^$' ./... | tee bench.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench.txt

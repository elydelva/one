name: E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build binary
        run: go build -o bin/one ./cmd/one
      - name: Run E2E tests
        run: go test -tags=e2e -timeout=5m ./tests/e2e/... 2>/dev/null || true
